name: LIA Runtime Guard

on:
  push:
    paths:
      - 'packages/lia-runtime/**'
  pull_request:
    paths:
      - 'packages/lia-runtime/**'

jobs:
  build-runtime:
    name: Build @luminnus/lia-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@luminnus/lia-runtime
      - run: pnpm turbo run typecheck --filter=@luminnus/lia-runtime

  build-admin:
    name: Build Admin (lia-unified)
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=lia-unified

  build-client:
    name: Build Dashboard Client
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=luminnus-dashboard

  parity-check:
    name: Parity Guard
    needs: [build-admin, build-client]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Parity verified - both apps build successfully with shared runtime"
